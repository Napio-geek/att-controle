<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atlântico — Controle de Atividades e Frota (Diário Enxuto)</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface-subtle: #f8fafc;
      --border: #cbd5e1;
      --border-light: #e2e8f0;
      --text: #0f172a;
      --text-muted: #475569;
      --primary: #0f4c81;
      --primary-hover: #0a355c;
      --primary-soft: #eff6ff;
      --accent: #0284c7;
      --danger: #dc2626;
      --danger-soft: #fef2f2;
      --warning: #d97706;
      --warning-soft: #fffbeb;
      --success: #059669;
      --success-soft: #ecfdf5;
      --radius: 12px;
      --shadow: 0 2px 10px rgba(15, 23, 42, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.45;
      padding-bottom: 40px;
    }

    header {
      background: linear-gradient(135deg, #0f172a 0%, #0f4c81 100%);
      color: #fff;
      padding: 16px 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .brand h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .brand p {
      font-size: 0.78rem;
      color: #cbd5e1;
    }

    .live-clock {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot-live {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #34d399;
      box-shadow: 0 0 6px #34d399;
    }

    .container {
      max-width: 960px;
      margin: 20px auto;
      padding: 0 16px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    @media (min-width: 840px) {
      .container {
        grid-template-columns: 410px 1fr;
        align-items: start;
      }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-light);
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stamp-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface-subtle);
      border: 1px solid var(--border-light);
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 14px;
      font-size: 0.82rem;
    }

    .stamp-info {
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stamp-info strong {
      color: var(--text);
    }

    .link-btn {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
    }

    .manual-datetime-box {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      background: var(--warning-soft);
      border: 1px solid #fde68a;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 14px;
    }

    .manual-datetime-box.open {
      display: grid;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 5px;
    }

    select, input[type="text"], input[type="date"], input[type="time"], textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.92rem;
      color: var(--text);
      background-color: #fff;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    select:focus, input:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(15, 76, 129, 0.12);
    }

    textarea {
      resize: vertical;
      min-height: 76px;
    }

    /* Botão Duplo IDA / VOLTA */
    .segmented-control {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .seg-btn {
      padding: 10px;
      border: 1.5px solid var(--border);
      background: var(--surface-subtle);
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.88rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
    }

    .seg-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      box-shadow: 0 2px 6px rgba(15, 76, 129, 0.25);
    }

    /* Etiqueta discreta da automação silenciosa */
    .auto-pill {
      margin-top: 7px;
      background: var(--primary-soft);
      border: 1px solid #bfdbfe;
      color: #1e3a8a;
      border-radius: 8px;
      padding: 8px 11px;
      font-size: 0.8rem;
      display: flex;
      flex-wrap: wrap;
      gap: 6px 12px;
      align-items: center;
    }

    .auto-pill span {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .auto-pill strong {
      font-weight: 700;
    }

    /* Botão expansível + Detalhes extras */
    .extra-toggle {
      width: 100%;
      background: var(--surface-subtle);
      border: 1px dashed var(--border);
      color: var(--primary);
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 0.83rem;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      transition: background 0.15s;
    }

    .extra-toggle:hover {
      background: #e2e8f0;
    }

    .extra-panel {
      display: none;
      background: var(--surface-subtle);
      border: 1px solid var(--border-light);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
    }

    .extra-panel.open {
      display: block;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-primary {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .btn-secondary:hover {
      background: var(--surface-subtle);
    }

    /* Lista de registros */
    .log-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .log-item {
      border: 1px solid var(--border-light);
      border-left: 4px solid var(--primary);
      border-radius: 8px;
      padding: 12px 14px;
      background: #fff;
    }

    .log-item.cat-quebra { border-left-color: var(--danger); }
    .log-item.cat-atraso { border-left-color: var(--warning); }
    .log-item.cat-supressao { border-left-color: #7c3aed; }
    .log-item.cat-troca { border-left-color: var(--accent); }

    .log-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 6px;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .badge-quebra { background: var(--danger-soft); color: var(--danger); }
    .badge-atraso { background: var(--warning-soft); color: var(--warning); }
    .badge-supressao { background: #f3e8ff; color: #6d28d9; }
    .badge-troca { background: var(--primary-soft); color: var(--primary); }
    .badge-outros { background: #f1f5f9; color: #334155; }

    .log-meta {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .log-route {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }

    .log-auto-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 6px;
    }

    .tag {
      background: var(--surface-subtle);
      border: 1px solid var(--border-light);
      color: var(--text-muted);
      font-size: 0.75rem;
      padding: 2px 7px;
      border-radius: 5px;
      font-weight: 600;
    }

    .log-desc {
      font-size: 0.86rem;
      color: var(--text);
      margin-bottom: 8px;
    }

    .log-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .btn-tiny {
      background: none;
      border: none;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-muted);
    }

    .btn-tiny:hover { color: var(--danger); }

    .empty-state {
      text-align: center;
      padding: 28px 16px;
      color: var(--text-muted);
      font-size: 0.88rem;
      border: 1px dashed var(--border);
      border-radius: 8px;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #0f172a;
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(0,0,0,0.2);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: all 0.2s;
      z-index: 999;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <h1>Atlântico • Diário de Ocorrências</h1>
      <p>Operação São Francisco do Conde • Lançamento Rápido</p>
    </div>
    <div class="live-clock">
      <span class="dot-live"></span>
      <span id="headerClock">--/--/---- • --:--</span>
    </div>
  </div>
</header>

<main class="container">
  <!-- FORMULÁRIO ENXUTO -->
  <section class="card">
    <div class="card-header">
      <h2 class="card-title">Novo Registro</h2>
      <span id="dayTypeBadge" class="badge badge-troca">Dia Útil</span>
    </div>

    <!-- Carimbo Automático de Data/Hora -->
    <div class="stamp-bar">
      <div class="stamp-info">
        <span>Registro automático:</span>
        <strong id="autoStampText">Agora (--:--)</strong>
      </div>
      <button type="button" class="link-btn" id="toggleManualTime">Alterar</button>
    </div>

    <!-- Campos retroativos ocultos por padrão -->
    <div class="manual-datetime-box" id="manualTimeBox">
      <div>
        <label for="manualDate">Data</label>
        <input type="date" id="manualDate" />
      </div>
      <div>
        <label for="manualTime">Hora</label>
        <input type="time" id="manualTime" />
      </div>
    </div>

    <form id="occurrenceForm">
      <!-- 1. LINHA -->
      <div class="form-group">
        <label for="linhaSelect">1. Linha</label>
        <select id="linhaSelect" required>
          <option value="R05">R05 — Sede / Jabequara</option>
          <option value="R07" selected>R07 — Santa Elisa / Roseira via Campinas</option>
          <option value="R08">R08 — Curupeba / Sede</option>
          <option value="R09">R09 — Ferrolho / Sede</option>
          <option value="R10">R10 — Santo Estevão / Sede</option>
          <option value="R11">R11 — Sede / Coroado</option>
        </select>
      </div>

      <!-- 2. SENTIDO (IDA / VOLTA) -->
      <div class="form-group">
        <label>2. Sentido da Viagem</label>
        <div class="segmented-control">
          <button type="button" class="seg-btn active" data-sentido="IDA" id="btnIda">IDA</button>
          <button type="button" class="seg-btn" data-sentido="VOLTA" id="btnVolta">VOLTA</button>
        </div>
      </div>

      <!-- 3. HORÁRIO DA VIAGEM (FILTRADO PELA CARTA HORÁRIA) -->
      <div class="form-group">
        <label for="horarioSelect">3. Horário da Viagem (Carta Horária)</label>
        <select id="horarioSelect" required></select>
        <!-- Resumo silencioso preenchido automaticamente -->
        <div class="auto-pill" id="autoTripSummary">
          <span>Viagem: <strong id="pillViagem">--</strong></span>
          <span>Carro Titular: <strong id="pillCarro">--</strong></span>
          <span>Roteiro: <strong id="pillRoteiro">--</strong></span>
        </div>
      </div>

      <!-- 4. MOTIVO / CATEGORIA -->
      <div class="form-group">
        <label for="categoriaSelect">4. Ocorrência / Motivo</label>
        <select id="categoriaSelect" required>
          <option value="Quebra Mecânica">Quebra Mecânica</option>
          <option value="Atraso Operacional">Atraso Operacional</option>
          <option value="Troca de Veículo">Troca de Veículo / Substituição</option>
          <option value="Viagem Suprimida">Viagem Suprimida / Perdida</option>
          <option value="Falha Validador / Câmera">Falha Validador / Câmera</option>
          <option value="Outros">Outros</option>
        </select>
      </div>

      <!-- 5. OBSERVAÇÃO -->
      <div class="form-group">
        <label for="obsInput">5. Observação</label>
        <textarea id="obsInput" placeholder="Descreva rapidamente o ocorrido..." required></textarea>
      </div>

      <!-- BOTÃO EXPANSÍVEL PARA DETALHES EXTRAS -->
      <button type="button" class="extra-toggle" id="toggleExtraBtn">
        <span>+ Detalhes extras (Carro reserva, Motorista, Ação)</span>
        <span id="extraArrow">▼</span>
      </button>

      <div class="extra-panel" id="extraPanel">
        <div class="grid-2" style="margin-bottom: 10px;">
          <div>
            <label for="carroReservaInput">Carro Reserva</label>
            <input type="text" id="carroReservaInput" placeholder="Ex: 2052" />
          </div>
          <div>
            <label for="motoristaInput">Motorista</label>
            <input type="text" id="motoristaInput" placeholder="Nome ou escala" />
          </div>
        </div>
        <div>
          <label for="acaoInput">Ação Tomada</label>
          <input type="text" id="acaoInput" placeholder="Ex: Carro socorrido na garagem / viagem assumida" />
        </div>
      </div>

      <button type="submit" class="btn-primary">Salvar Ocorrência</button>
    </form>
  </section>

  <!-- LISTA DE OCORRÊNCIAS DO DIA -->
  <section class="card">
    <div class="card-header">
      <h2 class="card-title">Registros de Hoje (<span id="countLogs">0</span>)</h2>
      <button type="button" class="btn-secondary" id="copyWhatsappBtn">Copiar Resumo WhatsApp</button>
    </div>

    <div class="log-list" id="logList">
      <div class="empty-state">Nenhuma ocorrência lançada ainda hoje.</div>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
  // Base exemplo da Carta Horária (por Linha, Tipo de Dia e Sentido)
  const CARTA_HORARIA = {
    R05: {
      UTIL: {
        IDA: [
          { hora: "05:40", viagem: "01", carro: "2012", roteiro: "Sede → Jabequara" },
          { hora: "07:10", viagem: "03", carro: "2012", roteiro: "Sede → Jabequara" },
          { hora: "12:00", viagem: "05", carro: "2018", roteiro: "Sede → Jabequara" },
          { hora: "17:20", viagem: "07", carro: "2018", roteiro: "Sede → Jabequara" }
        ],
        VOLTA: [
          { hora: "06:20", viagem: "02", carro: "2012", roteiro: "Jabequara → Sede" },
          { hora: "08:00", viagem: "04", carro: "2012", roteiro: "Jabequara → Sede" },
          { hora: "13:00", viagem: "06", carro: "2018", roteiro: "Jabequara → Sede" },
          { hora: "18:10", viagem: "08", carro: "2018", roteiro: "Jabequara → Sede" }
        ]
      }
    },
    R07: {
      UTIL: {
        IDA: [
          { hora: "05:30", viagem: "01", carro: "2045", roteiro: "Santa Elisa → Roseira via Campinas" },
          { hora: "07:00", viagem: "03", carro: "2045", roteiro: "Santa Elisa → Roseira via Campinas" },
          { hora: "08:30", viagem: "05", carro: "2045", roteiro: "Santa Elisa → Roseira via Campinas" },
          { hora: "11:30", viagem: "07", carro: "2049", roteiro: "Santa Elisa → Roseira via Campinas" },
          { hora: "15:00", viagem: "09", carro: "2049", roteiro: "Santa Elisa → Roseira via Campinas" }
        ],
        VOLTA: [
          { hora: "06:15", viagem: "02", carro: "2045", roteiro: "Roseira → Santa Elisa via Campinas" },
          { hora: "07:45", viagem: "04", carro: "2045", roteiro: "Roseira → Santa Elisa via Campinas" },
          { hora: "09:15", viagem: "06", carro: "2045", roteiro: "Roseira → Santa Elisa via Campinas" },
          { hora: "12:20", viagem: "08", carro: "2049", roteiro: "Roseira → Santa Elisa via Campinas" },
          { hora: "16:00", viagem: "10", carro: "2049", roteiro: "Roseira → Santa Elisa via Campinas" }
        ]
      }
    },
    R08: {
      UTIL: {
        IDA: [
          { hora: "06:00", viagem: "01", carro: "2031", roteiro: "Curupeba → Sede" },
          { hora: "09:00", viagem: "03", carro: "2031", roteiro: "Curupeba → Sede" },
          { hora: "14:00", viagem: "05", carro: "2031", roteiro: "Curupeba → Sede" }
        ],
        VOLTA: [
          { hora: "07:30", viagem: "02", carro: "2031", roteiro: "Sede → Curupeba" },
          { hora: "11:30", viagem: "04", carro: "2031", roteiro: "Sede → Curupeba" },
          { hora: "17:00", viagem: "06", carro: "2031", roteiro: "Sede → Curupeba" }
        ]
      }
    },
    R09: {
      UTIL: {
        IDA: [
          { hora: "05:50", viagem: "01", carro: "2024", roteiro: "Ferrolho → Sede" },
          { hora: "12:30", viagem: "03", carro: "2024", roteiro: "Ferrolho → Sede" }
        ],
        VOLTA: [
          { hora: "07:00", viagem: "02", carro: "2024", roteiro: "Sede → Ferrolho" },
          { hora: "17:30", viagem: "04", carro: "2024", roteiro: "Sede → Ferrolho" }
        ]
      }
    },
    R10: {
      UTIL: {
        IDA: [
          { hora: "05:45", viagem: "01", carro: "2038", roteiro: "Santo Estevão → Sede" },
          { hora: "13:15", viagem: "03", carro: "2038", roteiro: "Santo Estevão → Sede" }
        ],
        VOLTA: [
          { hora: "07:15", viagem: "02", carro: "2038", roteiro: "Sede → Santo Estevão" },
          { hora: "17:45", viagem: "04", carro: "2038", roteiro: "Sede → Santo Estevão" }
        ]
      }
    },
    R11: {
      UTIL: {
        IDA: [
          { hora: "06:10", viagem: "01", carro: "2055", roteiro: "Sede → Coroado" },
          { hora: "14:10", viagem: "03", carro: "2055", roteiro: "Sede → Coroado" }
        ],
        VOLTA: [
          { hora: "06:50", viagem: "02", carro: "2055", roteiro: "Coroado → Sede" },
          { hora: "15:00", viagem: "04", carro: "2055", roteiro: "Coroado → Sede" }
        ]
      }
    }
  };

  let currentSentido = "IDA";
  let isManualTime = false;
  let occurrences = JSON.parse(localStorage.getItem("atlantico_diario_enxuto") || "[]");

  const linhaSelect = document.getElementById("linhaSelect");
  const horarioSelect = document.getElementById("horarioSelect");
  const btnIda = document.getElementById("btnIda");
  const btnVolta = document.getElementById("btnVolta");
  const pillViagem = document.getElementById("pillViagem");
  const pillCarro = document.getElementById("pillCarro");
  const pillRoteiro = document.getElementById("pillRoteiro");
  const toggleManualTime = document.getElementById("toggleManualTime");
  const manualTimeBox = document.getElementById("manualTimeBox");
  const toggleExtraBtn = document.getElementById("toggleExtraBtn");
  const extraPanel = document.getElementById("extraPanel");
  const extraArrow = document.getElementById("extraArrow");

  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2600);
  }

  function updateClock() {
    const now = new Date();
    const dateStr = now.toLocaleDateString("pt-BR");
    const timeStr = now.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
    document.getElementById("headerClock").textContent = `${dateStr} • ${timeStr}`;

    if (!isManualTime) {
      document.getElementById("autoStampText").textContent = `Agora (${dateStr} às ${timeStr})`;
    }

    const day = now.getDay();
    const badge = document.getElementById("dayTypeBadge");
    if (day === 0) badge.textContent = "Domingo / Feriado";
    else if (day === 6) badge.textContent = "Sábado";
    else badge.textContent = "Dia Útil";
  }

  function populateHorarios() {
    const linha = linhaSelect.value;
    const lista = (CARTA_HORARIA[linha] && CARTA_HORARIA[linha].UTIL[currentSentido]) || [];

    horarioSelect.innerHTML = "";
    lista.forEach((item, idx) => {
      const opt = document.createElement("option");
      opt.value = idx;
      opt.textContent = `${item.hora} — Viagem ${item.viagem}`;
      horarioSelect.appendChild(opt);
    });

    updateAutoPill();
  }

  function updateAutoPill() {
    const linha = linhaSelect.value;
    const lista = (CARTA_HORARIA[linha] && CARTA_HORARIA[linha].UTIL[currentSentido]) || [];
    const selected = lista[horarioSelect.value];

    if (selected) {
      pillViagem.textContent = selected.viagem;
      pillCarro.textContent = selected.carro;
      pillRoteiro.textContent = selected.roteiro;
    } else {
      pillViagem.textContent = "--";
      pillCarro.textContent = "--";
      pillRoteiro.textContent = "--";
    }
  }

  btnIda.addEventListener("click", () => {
    currentSentido = "IDA";
    btnIda.classList.add("active");
    btnVolta.classList.remove("active");
    populateHorarios();
  });

  btnVolta.addEventListener("click", () => {
    currentSentido = "VOLTA";
    btnVolta.classList.add("active");
    btnIda.classList.remove("active");
    populateHorarios();
  });

  linhaSelect.addEventListener("change", populateHorarios);
  horarioSelect.addEventListener("change", updateAutoPill);

  toggleManualTime.addEventListener("click", () => {
    isManualTime = !isManualTime;
    manualTimeBox.classList.toggle("open", isManualTime);
    toggleManualTime.textContent = isManualTime ? "Usar hora atual" : "Alterar";

    if (isManualTime) {
      const now = new Date();
      document.getElementById("manualDate").value = now.toISOString().split("T")[0];
      document.getElementById("manualTime").value = now.toTimeString().slice(0, 5);
      document.getElementById("autoStampText").textContent = "Data/hora manual ativa";
    } else {
      updateClock();
    }
  });

  toggleExtraBtn.addEventListener("click", () => {
    const isOpen = extraPanel.classList.toggle("open");
    extraArrow.textContent = isOpen ? "▲" : "▼";
  });

  function getCategoryClass(cat) {
    if (cat.includes("Quebra")) return { item: "cat-quebra", badge: "badge-quebra" };
    if (cat.includes("Atraso")) return { item: "cat-atraso", badge: "badge-atraso" };
    if (cat.includes("Suprimida")) return { item: "cat-supressao", badge: "badge-supressao" };
    if (cat.includes("Troca")) return { item: "cat-troca", badge: "badge-troca" };
    return { item: "", badge: "badge-outros" };
  }

  function renderLogs() {
    const listEl = document.getElementById("logList");
    document.getElementById("countLogs").textContent = occurrences.length;

    if (occurrences.length === 0) {
      listEl.innerHTML = `<div class="empty-state">Nenhuma ocorrência lançada ainda hoje.</div>`;
      return;
    }

    listEl.innerHTML = occurrences.map((occ) => {
      const styles = getCategoryClass(occ.categoria);
      return `
        <div class="log-item ${styles.item}">
          <div class="log-top">
            <span class="badge ${styles.badge}">${occ.categoria}</span>
            <span class="log-meta">Reg: ${occ.dataRegistro} às ${occ.horaRegistro}</span>
          </div>
          <div class="log-route">${occ.linha} • ${occ.sentido} (${occ.horarioViagem}) — ${occ.roteiro}</div>
          <div class="log-auto-tags">
            <span class="tag">Viagem ${occ.viagem}</span>
            <span class="tag">Titular: ${occ.carroTitular}</span>
            ${occ.carroReserva ? `<span class="tag" style="color:#0284c7;border-color:#bae6fd;">Reserva: ${occ.carroReserva}</span>` : ""}
            ${occ.motorista ? `<span class="tag">Mot: ${occ.motorista}</span>` : ""}
          </div>
          <div class="log-desc">${occ.obs}</div>
          ${occ.acao ? `<div class="log-meta" style="margin-bottom:6px;"><strong>Ação:</strong> ${occ.acao}</div>` : ""}
          <div class="log-actions">
            <button type="button" class="btn-tiny" onclick="deleteLog(${occ.id})">Excluir</button>
          </div>
        </div>
      `;
    }).join("");
  }

  window.deleteLog = function(id) {
    occurrences = occurrences.filter((o) => o.id !== id);
    localStorage.setItem("atlantico_diario_enxuto", JSON.stringify(occurrences));
    renderLogs();
    showToast("Registro removido.");
  };

  document.getElementById("occurrenceForm").addEventListener("submit", (e) => {
    e.preventDefault();

    const now = new Date();
    let dataRegistro = now.toLocaleDateString("pt-BR");
    let horaRegistro = now.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });

    if (isManualTime) {
      const mDate = document.getElementById("manualDate").value;
      const mTime = document.getElementById("manualTime").value;
      if (mDate) dataRegistro = mDate.split("-").reverse().join("/");
      if (mTime) horaRegistro = mTime;
    }

    const linha = linhaSelect.value;
    const lista = (CARTA_HORARIA[linha] && CARTA_HORARIA[linha].UTIL[currentSentido]) || [];
    const trip = lista[horarioSelect.value] || { hora: "--:--", viagem: "--", carro: "--", roteiro: "" };

    const novoRegistro = {
      id: Date.now(),
      dataRegistro,
      horaRegistro,
      linha,
      sentido: currentSentido,
      horarioViagem: trip.hora,
      viagem: trip.viagem,
      carroTitular: trip.carro,
      roteiro: trip.roteiro,
      categoria: document.getElementById("categoriaSelect").value,
      obs: document.getElementById("obsInput").value.trim(),
      carroReserva: document.getElementById("carroReservaInput").value.trim(),
      motorista: document.getElementById("motoristaInput").value.trim(),
      acao: document.getElementById("acaoInput").value.trim()
    };

    occurrences.unshift(novoRegistro);
    localStorage.setItem("atlantico_diario_enxuto", JSON.stringify(occurrences));

    // Limpa apenas observação e extras
    document.getElementById("obsInput").value = "";
    document.getElementById("carroReservaInput").value = "";
    document.getElementById("motoristaInput").value = "";
    document.getElementById("acaoInput").value = "";
    extraPanel.classList.remove("open");
    extraArrow.textContent = "▼";

    renderLogs();
    showToast("Ocorrência salva com sucesso!");
  });

  document.getElementById("copyWhatsappBtn").addEventListener("click", () => {
    if (occurrences.length === 0) {
      showToast("Nenhuma ocorrência para copiar.");
      return;
    }
    const hoje = new Date().toLocaleDateString("pt-BR");
    let texto = `*ATLÂNTICO — DIÁRIO DE OCORRÊNCIAS (${hoje})*

`;
    occurrences.forEach((o, i) => {
      texto += `*${i + 1}. ${o.linha} (${o.sentido} - ${o.horarioViagem}) | Viagem ${o.viagem}*
`;
      texto += `• Motivo: ${o.categoria}
`;
      texto += `• Carro: ${o.carroTitular}${o.carroReserva ? ` → Reserva: ${o.carroReserva}` : ""}
`;
      if (o.motorista) texto += `• Motorista: ${o.motorista}
`;
      texto += `• Obs: ${o.obs}
`;
      if (o.acao) texto += `• Ação: ${o.acao}
`;
      texto += `• Lançado às ${o.horaRegistro}

`;
    });

    navigator.clipboard.writeText(texto.trim()).then(() => {
      showToast("Resumo copiado para o WhatsApp!");
    });
  });

  // Inicialização
  updateClock();
  setInterval(updateClock, 15000);
  populateHorarios();
  renderLogs();
</script>
</body>
</html>
