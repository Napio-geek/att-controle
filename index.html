<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#07898c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Atlântico Atividades">
<title>Atlântico — Controle de Atividades e Frota</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{--p:#07898c;--pd:#066f72;--bg:#f3f7f7;--txt:#173247;--mut:#6b7c84;--g:#16a765;--o:#f59e0b;--r:#e53935;--card:#fff;--bd:#e1eaec;--shadow:0 5px 18px #123b4518;--rad:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--txt)}
body{overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{min-height:100vh}
.header{background:var(--p);color:#fff;padding:13px 16px 15px;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px #0002}
.header-inner{max-width:1080px;margin:auto;display:flex;align-items:center;gap:12px}
.logo{height:54px;max-width:300px;width:auto;object-fit:contain}
.header-sub{font-size:12px;opacity:.9}
main{max-width:1080px;margin:auto;padding:18px 14px 92px}
.page{display:none}.page.active{display:block}
h1{font-size:26px;margin:3px 0 18px}.muted{color:var(--mut);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{color:#fff;border-radius:15px;padding:12px;box-shadow:var(--shadow);min-height:88px}.stat strong{display:block;font-size:29px;margin:5px 0}.stat span{font-size:12px}.stat.r{background:var(--r)}.stat.o{background:var(--o)}.stat.g{background:var(--g)}
.search,.field{width:100%;padding:13px 14px;border:1px solid #d6e1e4;border-radius:12px;background:#fff;outline:0}.search:focus,.field:focus{border-color:var(--p);box-shadow:0 0 0 3px #07898c20}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--rad);padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.vehicle{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--bd);border-radius:14px;padding:14px;margin:9px 0;box-shadow:0 2px 8px #0000000b}.vehicle .main{flex:1}.code{font-size:17px;font-weight:700}.msg{font-size:13px;margin-top:4px;color:var(--mut)}.dot{width:11px;height:11px;border-radius:50%;flex:none}.dot.g{background:var(--g)}.dot.o{background:var(--o)}.dot.r{background:var(--r)}
.btn{border:0;border-radius:12px;padding:12px 15px;background:var(--p);color:#fff;font-weight:700;width:100%}.btn:hover{background:var(--pd)}.btn:disabled{background:#b2c1c4;color:#fff;cursor:not-allowed;opacity:.8}.btn.secondary{background:#eaf1f2;color:var(--txt)}.btn.danger{background:#fff0f0;color:var(--r);border:1px solid #ffd1d1}.btn.warning{background:#fff8e6;color:#d97706;border:1px solid #fde68a}.btn.small{width:auto;padding:9px 12px}
.actions{display:flex;gap:8px;flex-wrap:wrap}.actions .btn{flex:1;min-width:130px}
.activity{background:#fff;border-radius:14px;padding:15px;margin:12px 0;border-left:5px solid var(--p);box-shadow:var(--shadow)}.activity.r{border-left-color:var(--r)}.activity.o{border-left-color:var(--o)}.activity.g{border-left-color:var(--g)}.activity-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.activity h3{font-size:16px;margin:0}.activity p{font-size:13px;color:var(--mut);margin:7px 0}.badge{color:#fff;border-radius:99px;padding:5px 8px;font-size:10px;font-weight:700;white-space:nowrap}.badge.r{background:var(--r)}.badge.o{background:var(--o)}.badge.g{background:var(--g)}
.act-btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.act-btns button{flex:1;min-width:140px}
.justified-box{background:#fff8e6;border:1px solid #fde68a;border-radius:10px;padding:10px;margin-top:10px;font-size:13px;color:#92400e}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}.grid2,.filters{display:grid;grid-template-columns:1fr 1fr;gap:12px}.notice{background:#e8f6f7;color:#155e61;border-radius:13px;padding:13px;font-size:13px}.empty{text-align:center;color:var(--mut);padding:32px}
.nav{position:fixed;z-index:30;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}.nav button{flex:1;max-width:190px;border:0;background:#fff;color:#63767e;padding:10px 5px 8px;font-size:12px}.nav button.active{color:var(--p);font-weight:700}.ico{display:block;font-size:21px;margin-bottom:3px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--bd)}th{background:#f4f8f9}
.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:#173247;color:#fff;padding:11px 15px;border-radius:10px;z-index:100;display:none;font-size:13px;box-shadow:var(--shadow)}
.modal-shield{position:fixed;inset:0;background:#0007;z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.modalbox{background:#fff;border-radius:18px;max-width:440px;width:100%;padding:20px;box-shadow:0 15px 50px #0006}.modalbox h2{margin:0 0 8px}.modalbox p{color:var(--mut);font-size:14px;line-height:1.45}.modal-actions{display:flex;gap:10px;margin-top:14px}.modal-actions button{flex:1}
.route-badge{display:inline-block;background:#eaf1f2;color:var(--p);font-weight:700;font-size:13px;padding:4px 10px;border-radius:8px;margin-top:4px}

.days-bar {display:flex;background:#fff;border:1px solid var(--bd);border-radius:12px;overflow-x:auto;padding:6px;gap:6px;margin-bottom:16px}
.day-btn {background:#f3f7f7;border:1px solid var(--bd);color:var(--mut);padding:8px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.day-btn.active {background:var(--p);color:#fff;border-color:var(--p)}
.lines-grid {display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-top:12px}
.line-card {background:#fff;border:1px solid var(--bd);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.line-header {font-size:15px;font-weight:700;color:var(--p);margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
.line-code {font-size:11px;color:var(--mut);font-weight:700}
.sched-box {font-size:12px;background:#fafcfd;border-radius:8px;border:1px solid var(--bd);padding:8px;margin:8px 0}
.assigned-chip {background:#eaf1f2;border:1px solid var(--p);border-radius:8px;padding:6px 10px;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;color:var(--txt);margin-top:6px}
.sub-alloc-title {font-size:11px;font-weight:bold;color:var(--mut);margin-top:6px;margin-bottom:2px}

.cross-row {background:#fafcfd;border:1px solid var(--bd);border-radius:8px;padding:6px 10px;margin:4px 0;font-size:11px}
.cross-row.active {background:#e8f6f7;border-color:var(--p);font-weight:bold}
.cross-badge {background:var(--p);color:#fff;font-size:9px;padding:2px 6px;border-radius:4px;float:right}

@media(max-width:650px){.logo{height:46px;max-width:250px}.stats{gap:6px}.stat{padding:9px 6px}.stat strong{font-size:24px}.stat span{font-size:10px}.grid2,.filters{grid-template-columns:1fr}.nav button{max-width:none}}
</style>
</head>
<body>
<div class="app">
<header class="header"><div class="header-inner">
  <img src="logo-atlantico.png" class="logo" alt="Atlântico" onerror="this.style.display='none'">
  <div class="header-sub">Controle de Atividades e Frota</div>
</div></header>

<main>
<section id="p-painel" class="page active">
<h1>Painel de Atividades</h1>
<div class="stats">
<div class="stat r"><span>Atrasados</span><strong id="nR">0</strong></div>
<div class="stat o"><span>Próximos / Pendentes</span><strong id="nO">0</strong></div>
<div class="stat g"><span>Em dia</span><strong id="nG">0</strong></div>
</div>
<input id="searchPanel" class="search" placeholder="🔎 Buscar por código do veículo ou roteiro..." oninput="
